spring:
  application:
    name: patient-management-service
  datasource:
    url: jdbc:h2:mem:patientdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update

# Default credentials for development/demo. Override via environment variables:
# APP_SECURITY_USERNAME and APP_SECURITY_PASSWORD
app:
  security:
    username: ${APP_SECURITY_USERNAME:demo-user}
    password: ${APP_SECURITY_PASSWORD:changeme}
